<!--
  FitDose app mark — source of truth for the PWA icon set.
  Lucide `Activity` glyph on the brand gradient (see DashboardHeader.tsx).

  The PNGs in this folder are generated from the same geometry by
  `node scripts/generate-icons.js` (no sharp / ImageMagick in this repo).
  If you edit this file, mirror the change in that script.

  Glyph box = 55% of the canvas: 512 * 0.55 = 281.6px, centred at 115.2px,
  so scale = 281.6 / 24 = 11.7333. The maskable variant uses 42% instead.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
    <defs>
        <linearGradient id="fitdose-brand" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#5E4AE3" />
            <stop offset="1" stop-color="#7C3AED" />
        </linearGradient>
    </defs>
    <rect width="512" height="512" fill="url(#fitdose-brand)" />
    <g transform="translate(115.2 115.2) scale(11.7333)">
        <polyline
            points="22 12 18 12 15 21 9 3 6 12 2 12"
            fill="none"
            stroke="#FFFFFF"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
        />
    </g>
</svg>
